# GPU is only needed for OPTIONAL EMAGE inference, not screen recording or VRM playback.
services:
  emage-infer:
    build:
      context: ./extensions/emage
      dockerfile: Dockerfile
      args:
        PANTOMATRIX_REF: ${PANTOMATRIX_REF:-main}
    profiles: [emage]
    gpus: all
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-example}
      HF_HOME: /opt/emage/cache
      XDG_CACHE_HOME: /opt/emage/cache
      PYTHONPATH: /opt/PantoMatrix
      PYTHONUNBUFFERED: '1'
    shm_size: 2gb
    volumes:
      - ./output:/out
      - emage_weights:/opt/emage/cache
volumes:
  emage_weights:
