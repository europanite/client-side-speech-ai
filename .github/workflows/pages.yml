name: pages
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: "skip"
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install deps
        working-directory: ./frontend/app
        run: npm ci
      - name: Generate sitemap
        run: |
          LASTMOD="$(git log -1 --format=%cs -- frontend/app/index.html frontend/app/src)"
          cat > frontend/app/public/sitemap.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://europanite.github.io/client-side-speech-ai/</loc>
              <lastmod>${LASTMOD}</lastmod>
            </url>
          </urlset>
          EOF
          cat frontend/app/public/sitemap.xml
      - name: Build
        working-directory: ./frontend/app
        run: npm run build:demo
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./frontend/app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
